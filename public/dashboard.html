<!DOCTYPE html>
<html lang="jp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ダッシュボード</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="page-header">
        <h1>ダッシュボード</h1>
        <button class="btn-primary" onclick="location.href='index.html'">日報一覧</button>
    </div>
    <div class="dashboard-cards">
        <div class="dashboard-card">
            <h3>今月の日報</h3>
            <span id="monthlyCount">0</span>
            <small>件</small>
        </div>
        <div class="dashboard-card">
            <h3>直近7日間</h3>
            <span id="weeklyCount">0</span>
            <small>件</small>
        </div>
    </div>
    <div class="dashboard-section">
        <h2>最近の日報</h2>
        <div id="recentReports"></div>
    </div>
    <script src="js/dashboard.js"></script>
</body>
</html>
